<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Laporan UGD</title>
<style>
:root{
  --bg:#0a0a0a; --card:rgba(20,20,20,.88); --line:#2b2b2b;
  --yellow:#ffd60a; --yellow-dim:rgba(255,214,10,.14);
  --text:#f5f5f0; --gray:#8d8d86; --wa:#25d366; --barH:76px;
  color-scheme: dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);margin:0;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(var(--barH) + 30px);color:var(--text)}
#topo{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.container{max-width:600px;margin:0 auto}
h2{text-align:center;font-weight:700;font-size:20px;margin:6px 0 4px}
.sync{text-align:center;font-size:12px;color:var(--gray);margin-bottom:22px}
.sync.ok{color:var(--yellow)}
.sync.off{color:#ff9f0a}
.section-label{font-size:13px;color:var(--yellow);margin:0 0 8px 15px;letter-spacing:.4px;font-weight:600}
.card{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--yellow-dim);border-radius:12px;padding:2px 0;margin-bottom:25px}
.row,.patient-row{display:flex;align-items:center;padding:12px 15px;border-bottom:.5px solid var(--line);min-height:52px}
.row:last-child,.patient-row:last-child{border-bottom:none}
.patient-row{justify-content:space-between;gap:10px}
.row label{width:130px;font-size:16px;flex-shrink:0}
.row select,.row input[type=text],.row input[type=datetime-local]{flex:1;min-width:0;border:none;outline:none;font-size:16px;background:transparent;text-align:right;color:var(--yellow);font-family:inherit}
.row select{text-align-last:right}
.row select option{background:#1a1a1a;color:#fff}
.row:focus-within{background:rgba(255,214,10,.05)}
.counter-group{display:flex;gap:12px}
.counter-label{font-size:10px;color:var(--gray);text-transform:uppercase;margin-bottom:2px;text-align:center}
.stepper{display:flex;background:#1c1c1c;border-radius:8px;overflow:hidden;border:.5px solid #3a3a3a}
.stepper button{width:38px;height:36px;border:none;background:transparent;font-size:20px;color:var(--yellow);cursor:pointer;touch-action:manipulation}
.stepper button:hover{background:var(--yellow-dim)}
.stepper button:active{background:rgba(255,214,10,.28)}
.stepper span{width:32px;display:flex;align-items:center;justify-content:center;font-weight:600;background:#000;font-size:15px;border-left:.5px solid #3a3a3a;border-right:.5px solid #3a3a3a}
.total{background:var(--card);border:1px solid var(--yellow-dim);padding:15px;border-radius:12px;display:flex;justify-content:space-between;font-weight:600;margin-bottom:25px}
.total span:last-child{color:var(--yellow)}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px;border-radius:6px}

.plus{flex-shrink:0;width:34px;height:34px;margin-left:10px;border-radius:50%;border:1px solid var(--yellow);background:var(--yellow-dim);color:var(--yellow);font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit;touch-action:manipulation;transition:transform .12s,background .15s}
.plus:hover{background:rgba(255,214,10,.28)}
.plus:active{transform:scale(.92)}
.plus.ok{background:var(--yellow);color:#000}

/* Dinas jaga: input + chip nama */
.card-h{display:flex;justify-content:space-between;align-items:center;padding:14px 15px 0}
.ttl{font-weight:700;font-size:17px;color:var(--yellow)}
.badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--yellow-dim);color:var(--yellow)}
.badge.off{background:rgba(255,159,10,.15);color:#ff9f0a}
.hint{font-size:13px;color:var(--gray);padding:8px 15px 12px;border-bottom:.5px solid var(--line)}
.blk{padding:14px 15px 18px;border-bottom:.5px solid var(--line)}
.blk:last-child{border-bottom:none}
.blk-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.role{font-size:14px;font-weight:600}
.blk-h select{border:1px solid #3a3a3a;border-radius:10px;background:#101010;color:var(--yellow);font-family:inherit;font-weight:600;font-size:15px;height:40px;padding:0 10px}
.blk-h select option{background:#1a1a1a;color:#fff}
.nf{margin-top:14px}
.nf label{display:block;font-size:12px;color:var(--gray);margin:0 0 5px 2px}
.nf .line{display:flex;gap:8px}
.nf input{flex:1;min-width:0;height:44px;border:1px solid #3a3a3a;border-radius:10px;background:#101010;padding:0 12px;font-size:16px;color:var(--text);font-family:inherit}
.nf input:focus,.nf input:focus-visible{outline:none;border-color:var(--yellow)}
.nf .plus{width:44px;height:44px;margin:0;border:none;border-radius:10px;background:var(--yellow);color:#000;font-size:22px;font-weight:700}
.nf .plus:hover{background:#ffe34d}
.nf .plus.ok{background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;border:1px solid #3a3a3a;background:#1a1a1a;border-radius:999px;overflow:hidden;transition:background .15s,border-color .15s}
.chip button{border:none;background:transparent;font-family:inherit;cursor:pointer;touch-action:manipulation}
.chip .cn{color:var(--text);font-size:14px;padding:8px 4px 8px 13px}
.chip .cx{color:var(--gray);font-size:17px;line-height:1;padding:8px 12px 8px 6px}
.chip .cx:hover{color:#ff453a}
.chip:hover{border-color:#5a5a5a}
.chip.on{background:var(--yellow-dim);border-color:var(--yellow)}
.chip.on .cn{color:var(--yellow);font-weight:600}
.kosong{font-size:13px;color:var(--gray)}

/* Bar bawah */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:100;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:rgba(10,10,10,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--yellow-dim)}
.btns{display:flex;gap:8px;max-width:600px;margin:0 auto}
.btns button{flex:1;border:none;border-radius:14px;padding:14px 6px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;touch-action:manipulation;transition:transform .12s,filter .15s}
.btns button:active{transform:scale(.97)}
.btns button:hover{filter:brightness(1.1)}
#btnToggle{background:transparent;color:var(--yellow);border:1.5px solid var(--yellow)}
#btnToggle.on{background:var(--yellow-dim)}
#btnCopy{background:var(--yellow);color:#000}
#btnCopy.success{background:#fff}
#btnWA{background:var(--wa);color:#000}

/* Pratinjau: slide up dari balik bar */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .35s}
.scrim.open{opacity:1;visibility:visible}
.sheet{position:fixed;left:0;right:0;bottom:var(--barH);z-index:90;max-width:640px;margin:0 auto;background:#141414;border:1px solid var(--yellow-dim);border-bottom:none;border-radius:20px 20px 0 0;padding:6px 14px 14px;box-shadow:0 -12px 40px rgba(0,0,0,.7);transform:translateY(calc(100% + var(--barH)));visibility:hidden;transition:transform .42s cubic-bezier(.32,.72,0,1),visibility 0s .42s;will-change:transform}
.sheet.open{transform:translateY(0);visibility:visible;transition:transform .42s cubic-bezier(.32,.72,0,1),visibility 0s}
.grip{width:100%;height:22px;border:none;background:transparent;cursor:pointer;display:block;padding:0}
.grip::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--yellow);margin:9px auto 0;opacity:.7}
textarea{width:100%;height:min(52vh,380px);border:none;resize:none;background:transparent;color:var(--text);font-family:inherit;font-size:14px;line-height:1.5;outline:none}

.toast{position:fixed;left:50%;bottom:calc(var(--barH) + 16px);transform:translate(-50%,20px);z-index:120;background:var(--yellow);color:#000;font-weight:600;font-size:14px;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s,transform .3s cubic-bezier(.32,.72,0,1);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Desktop: dua kolom */
@media (min-width:900px){
  body{padding-top:36px}
  .container{max-width:1000px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;align-items:start}
  h2{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<svg id="topo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" preserveAspectRatio="xMidYMid slice"></svg>

<div class="container">
  <h2>Laporan Serah Terima UGD</h2>
  <div class="sync" id="syncStatus">Spreadsheet belum diatur</div>

  <div class="cols">
    <div>
      <div class="section-label">Informasi Umum</div>
      <div class="card">
        <div class="row"><label for="ucapan">Salam</label>
          <select id="ucapan">
            <option>Selamat Pagi</option><option>Selamat Siang</option><option>Selamat Sore</option><option>Selamat Malam</option>
          </select></div>
        <div class="row"><label for="waktu_laporan">Tanggal (WIB)</label><input type="datetime-local" id="waktu_laporan"></div>
      </div>

      <div class="card">
        <div class="card-h"><span class="ttl">Dinas Jaga</span><span class="badge" id="badge">Google Sheets</span></div>
        <div class="hint">Terisi otomatis sesuai jam WIB saat ini — pilih manual kapan saja jika perlu.</div>
      <div class="blk">
        <div class="blk-h"><span class="role">Menyerahkan</span><select id="dinas_1" aria-label="Jenis dinas (Menyerahkan)"><option>Dinas Pagi</option><option>Dinas Siang</option><option>Dinas Malam</option></select></div>
        <div class="nf"><label for="dok_1">Dokter jaga</label><div class="line"><input type="text" id="dok_1" placeholder="Ketik nama, lalu Enter" autocomplete="off" enterkeyhint="done"><button type="button" class="plus" onclick="tambahNama('dok_1','dokter',this)" aria-label="Simpan nama ke spreadsheet" title="Simpan ke spreadsheet">＋</button></div></div>
        <div class="chips" id="ch_dok_1"></div>
        <div class="nf"><label for="per_1_1">Petugas 1</label><div class="line"><input type="text" id="per_1_1" placeholder="Ketik nama, lalu Enter" autocomplete="off" enterkeyhint="done"><button type="button" class="plus" onclick="tambahNama('per_1_1','perawat',this)" aria-label="Simpan nama ke spreadsheet" title="Simpan ke spreadsheet">＋</button></div></div>
        <div class="nf"><label for="per_1_2">Petugas 2</label><div class="line"><input type="text" id="per_1_2" placeholder="Ketik nama, lalu Enter" autocomplete="off" enterkeyhint="done"><button type="button" class="plus" onclick="tambahNama('per_1_2','perawat',this)" aria-label="Simpan nama ke spreadsheet" title="Simpan ke spreadsheet">＋</button></div></div>
        <div class="chips" id="ch_per_1"></div>
      </div>
      <div class="blk">
        <div class="blk-h"><span class="role">Menerima</span><select id="dinas_2" aria-label="Jenis dinas (Menerima)"><option>Dinas Pagi</option><option>Dinas Siang</option><option>Dinas Malam</option></select></div>
        <div class="nf"><label for="dok_2">Dokter jaga</label><div class="line"><input type="text" id="dok_2" placeholder="Ketik nama, lalu Enter" autocomplete="off" enterkeyhint="done"><button type="button" class="plus" onclick="tambahNama('dok_2','dokter',this)" aria-label="Simpan nama ke spreadsheet" title="Simpan ke spreadsheet">＋</button></div></div>
        <div class="chips" id="ch_dok_2"></div>
        <div class="nf"><label for="per_2_1">Petugas 1</label><div class="line"><input type="text" id="per_2_1" placeholder="Ketik nama, lalu Enter" autocomplete="off" enterkeyhint="done"><button type="button" class="plus" onclick="tambahNama('per_2_1','perawat',this)" aria-label="Simpan nama ke spreadsheet" title="Simpan ke spreadsheet">＋</button></div></div>
        <div class="nf"><label for="per_2_2">Petugas 2</label><div class="line"><input type="text" id="per_2_2" placeholder="Ketik nama, lalu Enter" autocomplete="off" enterkeyhint="done"><button type="button" class="plus" onclick="tambahNama('per_2_2','perawat',this)" aria-label="Simpan nama ke spreadsheet" title="Simpan ke spreadsheet">＋</button></div></div>
        <div class="chips" id="ch_per_2"></div>
      </div>
      </div>
    </div>

    <div>
      <div class="section-label">Keterangan Pasien</div>
      <div class="card" id="input_pasien"></div>

      <div class="total"><span>Total Pasien</span><span id="display_total">0 Orang</span></div>

    </div>
  </div>
</div>

<div class="scrim" id="scrim" onclick="togglePratinjau(false)"></div>
<div class="sheet" id="sheet" aria-hidden="true">
  <button class="grip" onclick="togglePratinjau(false)" aria-label="Tutup pratinjau"></button>
  <textarea id="hasil_teks" readonly></textarea>
</div>

<div class="bar" id="bar">
  <div class="btns">
    <button id="btnToggle" onclick="togglePratinjau()" aria-expanded="false">Pratinjau ▲</button>
    <button id="btnCopy" onclick="copyTeks()">Salin</button>
    <button id="btnWA" onclick="kirimWA()">WhatsApp</button>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
/* ====== PENGATURAN ====== */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwgrUzsJppU_ckg08XdBJvIjMf8-gJKM0t9gWwpK7sJuKMlLzrIjbxOCmFYkjXjc7g8NQ/exec";
// Jam shift (WIB, 24 jam)
const SHIFT_PAGI_MULAI = 7, SHIFT_SIANG_MULAI = 14, SHIFT_MALAM_MULAI = 21;
/* ======================= */

const kategori = ["Militer","PNS","KBT","Masyarakat Umum","Purnawirawan"];
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");

/* ---------- Waktu WIB ---------- */
function wibSekarang(){
  const p = {};
  new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Jakarta',hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})
    .formatToParts(new Date()).forEach(x=>p[x.type]=x.value);
  return `${p.year}-${p.month}-${p.day}T${String(p.hour%24).padStart(2,'0')}:${p.minute}`;
}
function salamByJam(h){ return h>=4&&h<11?"Selamat Pagi": h>=11&&h<15?"Selamat Siang": h>=15&&h<18?"Selamat Sore":"Selamat Malam"; }
function shiftByJam(h){ return h>=SHIFT_PAGI_MULAI&&h<SHIFT_SIANG_MULAI?"Dinas Pagi": h>=SHIFT_SIANG_MULAI&&h<SHIFT_MALAM_MULAI?"Dinas Siang":"Dinas Malam"; }
const SHIFT_SEBELUM = {"Dinas Pagi":"Dinas Malam","Dinas Siang":"Dinas Pagi","Dinas Malam":"Dinas Siang"};

const manual = {};
function otomatis(){
  const h = parseInt(($('waktu_laporan').value||wibSekarang()).slice(11,13));
  const menerima = shiftByJam(h);
  const set = (id,v)=>{ if(!manual[id]) $(id).value = v; };
  set('ucapan', salamByJam(h));
  set('dinas_2', menerima);
  set('dinas_1', SHIFT_SEBELUM[menerima]);
}

/* ---------- Init ---------- */
const NAMA_IDS = ['dok_1','dok_2','per_1_1','per_1_2','per_2_1','per_2_2'];
window.onload = function(){
  $('waktu_laporan').value = wibSekarang();

  $('input_pasien').innerHTML = kategori.map(kat=>`
    <div class="patient-row"><div>${kat}</div>
      <div class="counter-group">
        ${['rajal','ranap'].map(j=>`<div><div class="counter-label">${j}</div>
          <div class="stepper"><button onclick="step('${kat}_${j}',-1)" aria-label="Kurangi ${kat} ${j}">−</button><span id="${kat}_${j}">0</span><button onclick="step('${kat}_${j}',1)" aria-label="Tambah ${kat} ${j}">+</button></div></div>`).join('')}
      </div></div>`).join('');

  muatMemori();
  ['ucapan','dinas_1','dinas_2'].forEach(id=>$(id).addEventListener('change',()=>{manual[id]=true;}));
  $('waktu_laporan').addEventListener('change',()=>{ for(const k in manual) delete manual[k]; otomatis(); updateLaporan(); });
  document.querySelectorAll('input, select').forEach(el=>el.addEventListener('input',updateLaporan));
  NAMA_IDS.forEach(id=>{
    const el=$(id);
    el.addEventListener('change',autoSimpan);
    el.addEventListener('input',muatMemori);
    el.addEventListener('keydown',e=>{
      if(e.key!=='Enter') return;
      e.preventDefault(); tambahNama(id,jenisDari(id),el.nextElementSibling); el.blur();
    });
  });
  GRUP.forEach(g=>$(g.box).addEventListener('click',e=>klikChip(g,e)));
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') togglePratinjau(false); });
  window.addEventListener('online',()=>{ tampilStatus(); sinkronDariSheet(); });
  window.addEventListener('offline',tampilStatus);
  window.addEventListener('resize',ukurBar);

  ukurBar(); otomatis(); updateLaporan(); buatTopo(); tampilStatus(); sinkronDariSheet();

};

function ukurBar(){ document.documentElement.style.setProperty('--barH',$('bar').offsetHeight+'px'); }
function step(id,val){
  const el=$(id); el.innerText=Math.max(0,parseInt(el.innerText)+val); updateLaporan();
}
function toast(t){
  const el=$('toast'); el.textContent=t; el.classList.add('show');
  clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),2200);
}

/* ---------- Teks laporan ---------- */
function updateLaporan(){
  let d = new Date($('waktu_laporan').value); if(isNaN(d)) d = new Date(wibSekarang());
  const tgl = d.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  let total=0, ket="";
  kategori.forEach((kat,i)=>{
    const rajal=parseInt($(`${kat}_rajal`).innerText), ranap=parseInt($(`${kat}_ranap`).innerText);
    total+=rajal+ranap;
    const sub=(!rajal&&!ranap)?"nihil":(rajal&&!ranap)?`${rajal} rajal`:(!rajal&&ranap)?`${ranap} ranap`:`${rajal} rajal, ${ranap} ranap`;
    ket+=`${i+1}. ${kat}: ${sub}\n`;
  });
  $('display_total').innerText=total+" Orang";
  const v=id=>$(id).value.trim();
  const p2=id=>v(id)?"\n- "+v(id):"";
  $('hasil_teks').value =
`${v('ucapan')}\n\nKepada Yth. Karumkit TK. IV 12.07.03 Palangkaraya\n\n*Mohon Izin Melaporkan Serah Terima Dinas UNIT GAWAT DARURAT Rumah Sakit TNI AD*\n${tgl}, sebagai berikut :\n\n*${v('dinas_1')}*\n- ${v('dok_1')||"..."}\n- ${v('per_1_1')||"..."}${p2('per_1_2')}\n\n*${v('dinas_2')}*\n- ${v('dok_2')||"..."}\n- ${v('per_2_1')||"..."}${p2('per_2_2')}\n\n*Total Pasien : ${total} Orang*\n\nKETERANGAN :\n${ket.trim()}\n\nRumkit TNI-AD dalam keadaan aman, sekian Laporan selesai.\nTerimakasih 🙏🏻`;
}

/* ---------- Pratinjau slide up ---------- */
function togglePratinjau(paksa){
  const open = typeof paksa==='boolean' ? paksa : !$('sheet').classList.contains('open');
  $('sheet').classList.toggle('open',open);
  $('scrim').classList.toggle('open',open);
  $('sheet').setAttribute('aria-hidden',!open);
  $('btnToggle').classList.toggle('on',open);
  $('btnToggle').setAttribute('aria-expanded',open);
  $('btnToggle').innerText = open?"Pratinjau ▼":"Pratinjau ▲";
}

/* ---------- Memori nama (lokal + antrean ke Google Sheets) ---------- */
const bacaJSON = (k,def) => { try{return JSON.parse(localStorage.getItem(k))||def}catch(e){return def} };
const tulisJSON = (k,v) => { try{localStorage.setItem(k,JSON.stringify(v))}catch(e){} };
const bacaLokal = k => bacaJSON(k,[]);
const QK = ['dokter','perawat','hapus_dokter','hapus_perawat'];
const bacaQ = () => Object.assign({dokter:[],perawat:[],hapus_dokter:[],hapus_perawat:[]},bacaJSON('q_nama',{}));
const jumlahQ = () => { const q=bacaQ(); return QK.reduce((t,k)=>t+q[k].length,0); };
const sama = (a,b) => a.toLowerCase()===b.toLowerCase();
const ambilNama = ids => ids.map(i=>$(i).value.trim().replace(/\s+/g," ")).filter(n=>n.length>=2);

// Gabung ke daftar lokal; kembalikan nama yang benar-benar baru
function gabung(kunci,arr){
  const data=bacaLokal(kunci), ada=new Set(data.map(x=>x.toLowerCase())), baru=[];
  arr.forEach(n=>{ if(!ada.has(n.toLowerCase())){data.push(n);ada.add(n.toLowerCase());baru.push(n);} });
  if(baru.length) tulisJSON(kunci,data.sort((a,b)=>a.localeCompare(b)));
  return baru;
}
/* ---------- Nama tersimpan sebagai chip ---------- */
const jenisDari = id => id.startsWith('dok')?'dokter':'perawat';
const kunciDari = j => j==='dokter'?'m_dok':'m_per';
const GRUP = [1,2].flatMap(n=>[
  {box:`ch_dok_${n}`, jenis:'dokter',  ids:[`dok_${n}`]},
  {box:`ch_per_${n}`, jenis:'perawat', ids:[`per_${n}_1`,`per_${n}_2`]}
]);
function muatMemori(){
  GRUP.forEach(g=>{
    const dipakai=g.ids.map(i=>$(i).value.trim().toLowerCase());
    const daftar=bacaLokal(kunciDari(g.jenis));
    $(g.box).innerHTML = daftar.length
      ? daftar.map(n=>`<span class="chip${dipakai.includes(n.toLowerCase())?' on':''}" data-n="${esc(n)}"><button type="button" class="cn">${esc(n)}</button><button type="button" class="cx" aria-label="Hapus ${esc(n)}">×</button></span>`).join('')
      : '<span class="kosong">Belum ada nama tersimpan</span>';
  });
}
// Ketuk chip: pilih ke kolom kosong berikutnya (ketuk lagi untuk melepas); ×: hapus dari daftar
function klikChip(g,e){
  const chip=e.target.closest('.chip'); if(!chip) return;
  const nama=chip.dataset.n;
  if(e.target.closest('.cx')){ hapusNama(g.jenis,nama); muatMemori(); toast("Nama dihapus"); return; }
  const terpakai=g.ids.find(i=>sama($(i).value.trim(),nama));
  const sasaran=terpakai || g.ids.find(i=>!$(i).value.trim()) || g.ids[g.ids.length-1];
  $(sasaran).value = terpakai ? "" : nama;
  updateLaporan(); muatMemori();
}

let terhubung=false;
function status(t,cls){ const s=$('syncStatus'); s.textContent=t; s.className='sync'+(cls?' '+cls:''); const bd=$('badge'); if(bd) bd.className='badge'+(cls==='off'?' off':''); }
function tampilStatus(){
  const n=jumlahQ();
  if(!SCRIPT_URL) return status("Spreadsheet belum diatur");
  if(!navigator.onLine) return status("Offline · data tersimpan di perangkat"+(n?` · ${n} nama menunggu dikirim`:""),"off");
  if(n) return status(`${n} nama menunggu dikirim ke spreadsheet`,"off");
  status(terhubung?"Terhubung ke Google Spreadsheet":"Online",terhubung?"ok":"");
}

async function sinkronDariSheet(){
  if(!SCRIPT_URL || !navigator.onLine) return;
  try{
    status("Menyinkronkan nama…");
    await kirimAntrian();
    const j=await (await fetch(SCRIPT_URL)).json();
    // Daftar mengikuti spreadsheet; perubahan yang belum terkirim tetap diperhitungkan
    const q=bacaQ();
    const susun=(arr,tambah,hapus)=>{
      const seen=new Set(), out=[];
      [...arr.map(x=>String(x).trim()),...tambah].forEach(n=>{
        const k=n.toLowerCase();
        if(n && !seen.has(k) && !hapus.some(h=>sama(h,n))){ seen.add(k); out.push(n); }
      });
      return out.sort((a,b)=>a.localeCompare(b));
    };
    if(Array.isArray(j.dokter)) tulisJSON('m_dok',susun(j.dokter,q.dokter,q.hapus_dokter));
    if(Array.isArray(j.perawat)) tulisJSON('m_per',susun(j.perawat,q.perawat,q.hapus_perawat));
    muatMemori();
    terhubung=true;
  }catch(e){ status("Gagal terhubung ke spreadsheet · memakai data lokal","off"); return; }
  tampilStatus();
}

// Kirim antrean; kalau gagal/offline, antrean tetap disimpan dan dicoba lagi saat online
let mengirim=false;
async function kirimAntrian(){
  if(!SCRIPT_URL || mengirim || !jumlahQ()) return tampilStatus();
  if(!navigator.onLine) return tampilStatus();
  mengirim=true;
  const q=bacaQ();
  try{
    await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(q)});
    const sisa=bacaQ();
    QK.forEach(k=>{ sisa[k]=sisa[k].filter(n=>!q[k].includes(n)); });
    tulisJSON('q_nama',sisa);
    terhubung=true; tampilStatus();
    if(!jumlahQ()) status("Nama tersimpan di Google Spreadsheet","ok");
  }catch(e){ tampilStatus(); }
  mengirim=false;
}

// Masukkan nama ke daftar lokal + antrean, lalu coba kirim
function catatNama(dokter,perawat){
  const bd=gabung('m_dok',dokter), bp=gabung('m_per',perawat);
  if(bd.length||bp.length){
    const q=bacaQ();
    bd.forEach(n=>{ if(!q.dokter.includes(n)) q.dokter.push(n); q.hapus_dokter=q.hapus_dokter.filter(x=>!sama(x,n)); });
    bp.forEach(n=>{ if(!q.perawat.includes(n)) q.perawat.push(n); q.hapus_perawat=q.hapus_perawat.filter(x=>!sama(x,n)); });
    tulisJSON('q_nama',q); muatMemori();
  }
  tampilStatus();
  return kirimAntrian().then(()=>bd.length+bp.length);
}

// Hapus nama dari daftar lokal dan spreadsheet (masuk antrean jika offline)
function hapusNama(jenis,nama){
  const kunci=kunciDari(jenis);
  tulisJSON(kunci,bacaLokal(kunci).filter(x=>!sama(x,nama)));
  const q=bacaQ();
  q[jenis]=q[jenis].filter(x=>!sama(x,nama));          // belum sempat terkirim: batalkan
  if(!q['hapus_'+jenis].some(x=>sama(x,nama))) q['hapus_'+jenis].push(nama);
  tulisJSON('q_nama',q);
  tampilStatus(); kirimAntrian();
}

// Otomatis: dipanggil saat kolom nama selesai diisi, serta saat Salin / WhatsApp
function autoSimpan(){
  catatNama(ambilNama(['dok_1','dok_2']), ambilNama(['per_1_1','per_1_2','per_2_1','per_2_2']));
}

/* ---------- Tambah nama manual (tombol ＋ di samping input) ---------- */
async function tambahNama(id,jenis,btn){
  const nama=$(id).value.trim().replace(/\s+/g," ");
  if(nama.length<2){ $(id).focus(); toast("Isi nama dulu"); return; }
  const dokter=jenis==='dokter';
  const jumlah=await catatNama(dokter?[nama]:[], dokter?[]:[nama]);
  btn.classList.add('ok'); btn.textContent="✓";
  setTimeout(()=>{ btn.classList.remove('ok'); btn.textContent="＋"; },1500);
  toast(jumlah ? (navigator.onLine?"Nama ditambahkan":"Nama disimpan, dikirim saat online") : "Nama sudah ada di daftar");
}

/* ---------- Salin & WhatsApp ---------- */
async function copyTeks(){
  autoSimpan();
  const teks=$('hasil_teks').value;
  try{ await navigator.clipboard.writeText(teks); }
  catch(e){ const a=$('hasil_teks'); a.select(); document.execCommand('copy'); }
  const b=$('btnCopy'); b.innerText="Tersalin ✓"; b.classList.add('success');
  setTimeout(()=>{b.innerText="Salin";b.classList.remove('success');},2000);
}
function kirimWA(){
  autoSimpan();
  window.open("https://wa.me/?text="+encodeURIComponent($('hasil_teks').value),"_blank");
}

/* ---------- Background peta topografi ---------- */
function buatTopo(){
  const svg=$('topo'); let s=`<rect width="1200" height="1200" fill="#0a0a0a"/>`;
  let seed=7; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const pusat=[[250,250,16],[900,350,20],[600,820,18],[1050,1000,12],[130,950,13]];
  pusat.forEach(([cx,cy,n])=>{
    const ph=[rnd()*6.28,rnd()*6.28,rnd()*6.28,rnd()*6.28], am=[.16,.09,.06,.04];
    for(let i=1;i<=n;i++){
      let d="";
      for(let k=0;k<=120;k++){
        const a=k/120*Math.PI*2;
        let w=1; for(let m=0;m<4;m++) w+=am[m]*Math.sin((m+2)*a+ph[m]+i*.09);
        const r=i*26*w, x=cx+Math.cos(a)*r*1.15, y=cy+Math.sin(a)*r;
        d+=(k?"L":"M")+x.toFixed(1)+" "+y.toFixed(1);
      }
      const idx=i%5===0;
      s+=`<path d="${d}Z" fill="none" stroke="#ffd60a" stroke-opacity="${idx?.34:.16}" stroke-width="${idx?1.6:.9}"/>`;
    }
  });
  svg.innerHTML=s;
}
