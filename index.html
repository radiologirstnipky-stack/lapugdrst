<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Laporan UGD</title>
<style>
:root{
  --bg:#0a0a0a; --card:rgba(20,20,20,.88); --line:#2b2b2b;
  --yellow:#ffd60a; --yellow-dim:rgba(255,214,10,.14);
  --text:#f5f5f0; --gray:#8d8d86; --wa:#25d366;
  color-scheme: dark;
}
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);margin:0;padding:20px 20px 130px;color:var(--text)}
#topo{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.container{max-width:600px;margin:0 auto}
h2{text-align:center;font-weight:700;font-size:20px;margin:6px 0 4px}
.sync{text-align:center;font-size:12px;color:var(--gray);margin-bottom:22px}
.sync.ok{color:var(--yellow)}
.section-label{font-size:13px;color:var(--yellow);margin:0 0 8px 15px;letter-spacing:.4px;font-weight:600}
.card{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--yellow-dim);border-radius:12px;padding:2px 0;margin-bottom:25px}
.row,.patient-row{display:flex;align-items:center;padding:12px 15px;border-bottom:.5px solid var(--line)}
.row:last-child,.patient-row:last-child{border-bottom:none}
.patient-row{justify-content:space-between}
.row label{width:130px;font-size:16px;flex-shrink:0}
.row select,.row input{flex:1;min-width:0;border:none;outline:none;font-size:16px;background:transparent;text-align:right;color:var(--yellow);font-family:inherit}
.row select option{background:#1a1a1a;color:#fff}
.counter-group{display:flex;gap:12px}
.counter-label{font-size:10px;color:var(--gray);text-transform:uppercase;margin-bottom:2px;text-align:center}
.stepper{display:flex;background:#1c1c1c;border-radius:8px;overflow:hidden;border:.5px solid #3a3a3a}
.stepper button{width:32px;height:28px;border:none;background:transparent;font-size:18px;color:var(--yellow);cursor:pointer}
.stepper span{width:28px;display:flex;align-items:center;justify-content:center;font-weight:600;background:#000;font-size:14px;border-left:.5px solid #3a3a3a;border-right:.5px solid #3a3a3a}
.total{background:var(--card);border:1px solid var(--yellow-dim);padding:15px;border-radius:12px;display:flex;justify-content:space-between;font-weight:600}
.total span:last-child{color:var(--yellow)}

/* Bar bawah + pratinjau slide up */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:100;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:rgba(10,10,10,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--yellow-dim)}
.btns{display:flex;gap:8px;max-width:600px;margin:0 auto}
.btns button{flex:1;border:none;border-radius:14px;padding:14px 6px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
#btnToggle{background:transparent;color:var(--yellow);border:1.5px solid var(--yellow)}
#btnToggle.on{background:var(--yellow-dim)}
#btnCopy{background:var(--yellow);color:#000}
#btnCopy.success{background:#fff}
#btnWA{background:var(--wa);color:#000}
.sheet{position:absolute;left:0;right:0;bottom:100%;max-width:600px;margin:0 auto;background:#141414;border:1px solid var(--yellow-dim);border-bottom:none;border-radius:18px 18px 0 0;padding:10px 14px 14px;box-shadow:0 -10px 30px rgba(0,0,0,.6);transform:translateY(40px);opacity:0;visibility:hidden;transition:transform .3s ease,opacity .25s ease,visibility .3s}
.sheet.open{transform:translateY(0);opacity:1;visibility:visible}
.grip{width:40px;height:4px;border-radius:2px;background:var(--yellow);margin:0 auto 8px;opacity:.7}
textarea{width:100%;height:min(48vh,360px);border:none;resize:none;background:transparent;color:var(--text);font-family:inherit;font-size:14px;line-height:1.5;outline:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
</style>
</head>
<body>
<svg id="topo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" preserveAspectRatio="xMidYMid slice"></svg>

<div class="container">
  <h2>Laporan Serah Terima UGD</h2>
  <div class="sync" id="syncStatus">Spreadsheet belum diatur</div>

  <div class="section-label">Informasi Umum</div>
  <div class="card">
    <div class="row"><label>Salam</label>
      <select id="ucapan">
        <option>Selamat Pagi</option><option>Selamat Siang</option><option>Selamat Sore</option><option>Selamat Malam</option>
      </select></div>
    <div class="row"><label>Tanggal (WIB)</label><input type="datetime-local" id="waktu_laporan"></div>
  </div>

  <div class="section-label">Shift Yang Menyerahkan</div>
  <div class="card">
    <div class="row"><label>Jenis Dinas</label>
      <select id="dinas_1"><option>Dinas Pagi</option><option>Dinas Siang</option><option>Dinas Malam</option></select></div>
    <div class="row"><label>Dokter Jaga</label><input type="text" id="dok_1" list="list_dokter" placeholder="Dokter"></div>
    <div class="row"><label>Petugas 1</label><input type="text" id="per_1_1" list="list_perawat" placeholder="Petugas"></div>
    <div class="row"><label>Petugas 2</label><input type="text" id="per_1_2" list="list_perawat" placeholder="Petugas"></div>
  </div>

  <div class="section-label">Shift Yang Menerima</div>
  <div class="card">
    <div class="row"><label>Jenis Dinas</label>
      <select id="dinas_2"><option>Dinas Pagi</option><option>Dinas Siang</option><option>Dinas Malam</option></select></div>
    <div class="row"><label>Dokter Jaga</label><input type="text" id="dok_2" list="list_dokter" placeholder="Dokter"></div>
    <div class="row"><label>Petugas 1</label><input type="text" id="per_2_1" list="list_perawat" placeholder="Petugas"></div>
    <div class="row"><label>Petugas 2</label><input type="text" id="per_2_2" list="list_perawat" placeholder="Petugas"></div>
  </div>

  <div class="section-label">Keterangan Pasien</div>
  <div class="card" id="input_pasien"></div>

  <div class="total"><span>Total Pasien</span><span id="display_total">0 Orang</span></div>
</div>

<div class="bar">
  <div class="sheet" id="sheet">
    <div class="grip"></div>
    <textarea id="hasil_teks" readonly></textarea>
  </div>
  <div class="btns">
    <button id="btnToggle" onclick="togglePratinjau()">Pratinjau ▲</button>
    <button id="btnCopy" onclick="copyTeks()">Salin</button>
    <button id="btnWA" onclick="kirimWA()">WhatsApp</button>
  </div>
</div>

<datalist id="list_dokter"></datalist>
<datalist id="list_perawat"></datalist>

<script>
/* ====== PENGATURAN ====== */
// Tempel URL Web App Google Apps Script di antara tanda kutip (lihat tutorial)
const SCRIPT_URL = "";

// Jam shift (WIB, 24 jam). Ubah sesuai jadwal rumah sakit.
const SHIFT_PAGI_MULAI = 7, SHIFT_SIANG_MULAI = 14, SHIFT_MALAM_MULAI = 21;
/* ======================= */

const kategori = ["Militer","PNS","KBT","Masyarakat Umum","Purnawirawan"];
const $ = id => document.getElementById(id);

/* ---------- Waktu WIB ---------- */
function wibSekarang(){
  const p = {};
  new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Jakarta',hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})
    .formatToParts(new Date()).forEach(x=>p[x.type]=x.value);
  return `${p.year}-${p.month}-${p.day}T${String(p.hour%24).padStart(2,'0')}:${p.minute}`;
}
function salamByJam(h){ return h>=4&&h<11?"Selamat Pagi": h>=11&&h<15?"Selamat Siang": h>=15&&h<18?"Selamat Sore":"Selamat Malam"; }
function shiftByJam(h){ return h>=SHIFT_PAGI_MULAI&&h<SHIFT_SIANG_MULAI?"Dinas Pagi": h>=SHIFT_SIANG_MULAI&&h<SHIFT_MALAM_MULAI?"Dinas Siang":"Dinas Malam"; }
const SHIFT_SEBELUM = {"Dinas Pagi":"Dinas Malam","Dinas Siang":"Dinas Pagi","Dinas Malam":"Dinas Siang"};

const manual = {};
function otomatis(){
  const h = parseInt(($('waktu_laporan').value||wibSekarang()).slice(11,13));
  const menerima = shiftByJam(h);
  const set = (id,v)=>{ if(!manual[id]) $(id).value = v; };
  set('ucapan', salamByJam(h));
  set('dinas_2', menerima);
  set('dinas_1', SHIFT_SEBELUM[menerima]);
}

/* ---------- Init ---------- */
window.onload = function(){
  $('waktu_laporan').value = wibSekarang();

  $('input_pasien').innerHTML = kategori.map(kat=>`
    <div class="patient-row"><div>${kat}</div>
      <div class="counter-group">
        ${['rajal','ranap'].map(j=>`<div><div class="counter-label">${j}</div>
          <div class="stepper"><button onclick="step('${kat}_${j}',-1)">−</button><span id="${kat}_${j}">0</span><button onclick="step('${kat}_${j}',1)">+</button></div></div>`).join('')}
      </div></div>`).join('');

  muatMemori();
  ['ucapan','dinas_1','dinas_2'].forEach(id=>$(id).addEventListener('change',()=>{manual[id]=true;}));
  $('waktu_laporan').addEventListener('change',()=>{ for(const k in manual) delete manual[k]; otomatis(); updateLaporan(); });
  document.querySelectorAll('input, select').forEach(el=>el.addEventListener('input',updateLaporan));
  otomatis(); updateLaporan(); sinkronDariSheet(); buatTopo();
};

function step(id,val){
  const el=$(id); el.innerText=Math.max(0,parseInt(el.innerText)+val); updateLaporan();
}

/* ---------- Teks laporan ---------- */
function updateLaporan(){
  const d = new Date($('waktu_laporan').value);
  const tgl = d.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  let total=0, ket="";
  kategori.forEach((kat,i)=>{
    const rajal=parseInt($(`${kat}_rajal`).innerText), ranap=parseInt($(`${kat}_ranap`).innerText);
    total+=rajal+ranap;
    const sub=(!rajal&&!ranap)?"nihil":(rajal&&!ranap)?`${rajal} rajal`:(!rajal&&ranap)?`${ranap} ranap`:`${rajal} rajal, ${ranap} ranap`;
    ket+=`${i+1}. ${kat}: ${sub}\n`;
  });
  $('display_total').innerText=total+" Orang";
  const v=id=>$(id).value;
  const p2=id=>v(id)?"\n- "+v(id):"";
  $('hasil_teks').value =
`${v('ucapan')}\n\nKepada Yth. Karumkit TK. IV 12.07.03 Palangkaraya\n\n*Mohon Izin Melaporkan Serah Terima Dinas UNIT GAWAT DARURAT Rumah Sakit TNI AD*\n${tgl}, sebagai berikut :\n\n*${v('dinas_1')}*\n- dr. ${v('dok_1')||"..."}\n- ${v('per_1_1')||"..."}${p2('per_1_2')}\n\n*${v('dinas_2')}*\n- dr. ${v('dok_2')||"..."}\n- ${v('per_2_1')||"..."}${p2('per_2_2')}\n\n*Total Pasien : ${total} Orang*\n\nKETERANGAN :\n${ket.trim()}\n\nRumkit TNI-AD dalam keadaan aman, sekian Laporan selesai.\nTerimakasih 🙏🏻`;
}

/* ---------- Pratinjau slide up ---------- */
function togglePratinjau(){
  const open=$('sheet').classList.toggle('open');
  $('btnToggle').classList.toggle('on',open);
  $('btnToggle').innerText = open?"Pratinjau ▼":"Pratinjau ▲";
}

/* ---------- Memori nama (lokal + Google Sheets) ---------- */
const bacaLokal = k => { try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return []} };
const tulisLokal = (k,a) => { try{localStorage.setItem(k,JSON.stringify(a))}catch(e){} };
const ambilNama = ids => ids.map(i=>$(i).value.trim()).filter(n=>n.length>=2);

function gabung(kunci,arr){
  const data=bacaLokal(kunci), ada=new Set(data.map(x=>x.toLowerCase()));
  arr.forEach(n=>{ if(!ada.has(n.toLowerCase())){data.push(n);ada.add(n.toLowerCase());} });
  tulisLokal(kunci,data.sort((a,b)=>a.localeCompare(b)));
}
function muatMemori(){
  $('list_dokter').innerHTML=bacaLokal('m_dok').map(v=>`<option value="${v}">`).join('');
  $('list_perawat').innerHTML=bacaLokal('m_per').map(v=>`<option value="${v}">`).join('');
}
function status(t,ok){ const s=$('syncStatus'); s.textContent=t; s.classList.toggle('ok',!!ok); }

async function sinkronDariSheet(){
  if(!SCRIPT_URL) return;
  try{
    status("Menyinkronkan nama…");
    const j=await (await fetch(SCRIPT_URL)).json();
    gabung('m_dok',j.dokter||[]); gabung('m_per',j.perawat||[]); muatMemori();
    status("Terhubung ke Google Spreadsheet",true);
  }catch(e){ status("Gagal terhubung ke spreadsheet (memakai data lokal)"); }
}
async function simpanNama(){
  const dokter=ambilNama(['dok_1','dok_2']), perawat=ambilNama(['per_1_1','per_1_2','per_2_1','per_2_2']);
  gabung('m_dok',dokter); gabung('m_per',perawat); muatMemori();
  if(!SCRIPT_URL) return;
  try{
    await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({dokter,perawat})});
    status("Nama tersimpan di Google Spreadsheet",true);
  }catch(e){ status("Gagal menyimpan ke spreadsheet"); }
}

/* ---------- Salin & WhatsApp ---------- */
async function copyTeks(){
  simpanNama();
  const teks=$('hasil_teks').value;
  try{ await navigator.clipboard.writeText(teks); }
  catch(e){ const a=$('hasil_teks'); a.select(); document.execCommand('copy'); }
  const b=$('btnCopy'); b.innerText="Tersalin ✓"; b.classList.add('success');
  setTimeout(()=>{b.innerText="Salin";b.classList.remove('success');},2000);
}
function kirimWA(){
  simpanNama();
  window.open("https://wa.me/?text="+encodeURIComponent($('hasil_teks').value),"_blank");
}

/* ---------- Background peta topografi ---------- */
function buatTopo(){
  const svg=$('topo'); let s=`<rect width="1200" height="1200" fill="#0a0a0a"/>`;
  let seed=7; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const pusat=[[250,250,16],[900,350,20],[600,820,18],[1050,1000,12],[130,950,13]];
  pusat.forEach(([cx,cy,n])=>{
    const ph=[rnd()*6.28,rnd()*6.28,rnd()*6.28,rnd()*6.28], am=[.16,.09,.06,.04];
    for(let i=1;i<=n;i++){
      let d="";
      for(let k=0;k<=120;k++){
        const a=k/120*Math.PI*2;
        let w=1; for(let m=0;m<4;m++) w+=am[m]*Math.sin((m+2)*a+ph[m]+i*.09);
        const r=i*26*w, x=cx+Math.cos(a)*r*1.15, y=cy+Math.sin(a)*r;
        d+=(k?"L":"M")+x.toFixed(1)+" "+y.toFixed(1);
      }
      const idx=i%5===0;
      s+=`<path d="${d}Z" fill="none" stroke="#ffd60a" stroke-opacity="${idx?.34:.16}" stroke-width="${idx?1.6:.9}"/>`;
    }
  });
  svg.innerHTML=s;
}
</script>
</body>
</html>
